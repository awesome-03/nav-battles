<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nav Battles</title>
  
  <!-- Theme set to user default -->
  <script>
    {
      let theme = null;
      try {
        theme = localStorage.getItem("theme");
      } catch {
        // if storage is blocked
      }
      if (theme !== "light" && theme !== "dark"){
        theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.dataset.theme = theme;
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..700&display=swap">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="src/css/reset.css">
  <link rel="stylesheet" href="src/css/main.css">

  <!-- Scripts -->
  <script type="module" src="src/js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">Nav Battles</h1>
    <nav class="site-nav" aria-label="Main">
      <ul>
        <li><a href="#rooms" aria-current="page">Rooms</a></li>
        <li><a href="#stats">Stats</a></li>
        <li><a href="#tools">Tools</a></li>
      </ul>
    </nav>
    <button id="theme-toggle" class="theme-toggle icon-button" type="button">
      <span class="icon icon-mode" aria-hidden="true"></span>
    </button>
  </header>
</body>
</html>
